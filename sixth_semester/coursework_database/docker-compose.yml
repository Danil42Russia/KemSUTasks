version: "3.9"

services:
  postgres:
    container_name: "postgres"
    image: "postgres:15.2-alpine"
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - published: 5432
        target: 5432
        host_ip: "127.0.0.1"
